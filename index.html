<style>

.field{margin:12px 0}.field label{display:block;font-weight:bold;color:var(--navy);margin-bottom:4px}
.field .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.field.ok input{border-color:var(--ok);background:var(--okbg)}.field.no input{border-color:var(--bad)}

input[type=range]{width:min(420px,100%);accent-color:var(--teal)}

  nav#rail.open{max-height:none;padding:14px}#railbtn{display:inline-block}main{padding:16px 12px 70px}.card{padding:16px}}

<script>
/* ================= Climate I lesson: library ================= */
(function(){
'use strict';
var Q=new URLSearchParams(location.search);
var PREVIEW=Q.get('preview')==='1';
var CONFIG={BLOCK_PASTE:false,MASTERY:70};
var LMS=(function(){
  var api=null,ok=false,mode='local',NS=PREVIEW?'atmos1_prev_':'atmos1_v1_';
  function find(w){var n=0;while(w&&!w.API&&w.parent&&w.parent!==w&&n<12){w=w.parent;n++;}return(w&&w.API)?w.API:null;}
  try{api=find(window);if(!api&&window.opener)api=find(window.opener);}catch(e){api=null;}
  if(api&&!PREVIEW){try{ok=String(api.LMSInitialize(''))==='true';}catch(e){ok=false;}}
  mode=ok?'lms':'local';
  function lg(k){try{return localStorage.getItem(NS+k)||'';}catch(e){return '';}}
  function ls(k,v){try{localStorage.setItem(NS+k,v);}catch(e){}}
  return{mode:mode,
    get:function(k){if(mode==='lms'){try{return String(api.LMSGetValue(k));}catch(e){return '';}}return lg(k);},
    set:function(k,v){if(mode==='lms'){try{api.LMSSetValue(k,String(v));}catch(e){}}else ls(k,v);},
    commit:function(){if(mode==='lms'){try{api.LMSCommit('');}catch(e){}}},
    finish:function(){if(mode==='lms'){try{api.LMSCommit('');api.LMSFinish('');}catch(e){}mode='done';}}};
})();
function xmur(str){var h=1779033703^str.length;for(var i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=(h<<13)|(h>>>19);}
  return function(){h=Math.imul(h^(h>>>16),2246822507);h=Math.imul(h^(h>>>13),3266489909);return(h^=h>>>16)>>>0;};}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function shuffle(arr,key){var a=arr.slice(),r=mulberry(xmur(key)());for(var i=a.length-1;i>0;i--){var j=Math.floor(r()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function close(a,b,rel){rel=rel===undefined?0.02:rel;return Math.abs(a-b)<=Math.max(rel*Math.abs(b),1e-9);}
function fm(x,d){if(d===undefined)d=1;return Number(x.toFixed(d)).toLocaleString('en-US',{maximumFractionDigits:d});}

/* numbers and simple expressions: + - * / ^ ( ), e, ln(), exp(), sqrt(); no variables */
function evalNum(src){
  var s=String(src).toLowerCase().replace(/[\u2212\u2013]/g,'-').replace(/[\u00d7\u00b7]/g,'*').replace(/\u00f7/g,'/').replace(/[{\[]/g,'(').replace(/[}\]]/g,')').replace(/\s+/g,'');
  if(s.indexOf('=')>-1)s=s.slice(s.lastIndexOf('=')+1);
  s=s.replace(/(\d),(?=\d{3}(\D|$))/g,'$1').replace(/(\d(?:\.\d+)?)e([+-]?\d+)/g,'($1*10^($2))');
  if(!s)throw new Error('empty');
  var re=/(\d+\.?\d*|\.\d+)|([a-z]+)|([()+\-*\/^])/g,toks=[],m,last=0;
  while((m=re.exec(s))){
    if(m.index!==last)throw new Error('bad');last=re.lastIndex;
    if(m[1]!==undefined)toks.push({t:'n',v:parseFloat(m[1])});
    else if(m[2]){var w=m[2];
      if(w==='ln'||w==='exp'||w==='sqrt')toks.push({t:'f',v:w});
      else if(w==='e')toks.push({t:'e'});else throw new Error('sym');}
    else toks.push({t:'o',v:m[3]});
  }
  if(last!==s.length)throw new Error('bad');
  var pos=0;
  function pk(){return toks[pos];}
  function isOp(t,v){return t&&t.t==='o'&&t.v===v;}
  function atomStart(t){return t&&(t.t==='n'||t.t==='e'||t.t==='f'||isOp(t,'('));}
  function pExpr(){var a=pTerm();while(isOp(pk(),'+')||isOp(pk(),'-')){var op=toks[pos++].v,b=pTerm();a=op==='+'?a+b:a-b;}return a;}
  function pTerm(){var a=pUn();for(;;){var t=pk();
    if(isOp(t,'*')||isOp(t,'/')){pos++;var b=pUn();a=t.v==='*'?a*b:a/b;}
    else if(atomStart(t)){a=a*pUn();}else break;}return a;}
  function pUn(){if(isOp(pk(),'-')){pos++;return -pUn();}if(isOp(pk(),'+')){pos++;return pUn();}return pPow();}
  function pPow(){var b=pAtom();if(isOp(pk(),'^')){pos++;var neg=false;if(isOp(pk(),'-')){pos++;neg=true;}
    var x=pAtom();while(pk()&&(pk().t==='n'||pk().t==='e')){x=x*pAtom();}if(neg)x=-x;return Math.pow(b,x);}return b;}
  function pAtom(){var t=toks[pos++];if(!t)throw new Error('end');
    if(t.t==='n')return t.v;if(t.t==='e')return Math.E;
    if(t.t==='f'){var a=pAtom();return t.v==='ln'?Math.log(a):t.v==='exp'?Math.exp(a):Math.sqrt(a);}
    if(isOp(t,'(')){var v=pExpr();if(!isOp(pk(),')'))throw new Error('paren');pos++;return v;}
    throw new Error('tok');}
  var v=pExpr();if(pos!==toks.length||!isFinite(v))throw new Error('bad');return v;
}

/* ================= helpers and widgets ================= */
var ORDER=[],ACTS={},MODS=[];
function A(id,d){d.id=id;ACTS[id]=d;ORDER.push(id);return '<div data-act="'+id+'"></div>';}
function fig(src,alt,cap,cls){return '<figure'+(cls?' class="'+cls+'"':'')+'><img src="img/'+src+'.jpg" alt="'+alt+'"><figcaption>'+cap+'</figcaption></figure>';}
function mod(short,title,time,body){var ids=[],re=/data-act="([^"]+)"/g,m;while((m=re.exec(body)))ids.push(m[1]);MODS.push({short:short,title:title,time:time,body:body,acts:ids});}
function more(title,html){return '<details><summary>'+title+'</summary>'+html+'</details>';}
function $q(b,s){return b.querySelector(s);}

function mountLayers(box,done){
  var D=[['Troposphere','The lowest layer, where we live and where weather and most air pollution occur. It holds most of the atmosphere’s mass: even at Mount Everest (8.85 km) the pressure is only 28% of sea level.'],
    ['Stratosphere','Above the troposphere. The main concentration of the ozone layer sits here, roughly 15 to 35 km up, and temperature rises with height.'],
    ['Mesosphere','Above the stratosphere. Temperature falls again with height. By 50 km the pressure is only 0.1% of sea level.'],
    ['Thermosphere','The outermost layer shown. Temperature climbs steeply, and the ionosphere and magnetosphere begin here. At 90 km the pressure is 0.0001% of sea level.']];
  box.innerHTML='<div class="sph">'+D.map(function(s,i){return '<button type="button" data-k="'+i+'">'+s[0]+'</button>';}).join('')+'</div><div class="panel" aria-live="polite">Select each layer to see what happens there.</div>';
  var seen={},n=0,p=$q(box,'.panel');
  Array.prototype.forEach.call(box.querySelectorAll('button'),function(b){b.onclick=function(){Array.prototype.forEach.call(box.querySelectorAll('button'),function(x){x.classList.remove('on');});b.classList.add('on','seen');
    var k=+b.dataset.k;p.innerHTML='<b>'+D[k][0]+'.</b> '+D[k][1];if(!seen[k]){seen[k]=1;n++;}if(n===4)done();};});
}
function mountInversion(box,done){
  box.innerHTML='<div class="sph"><button type="button" data-k="0">Normal day</button><button type="button" data-k="1">Thermal inversion</button></div><svg class="w" viewBox="0 0 440 250" role="img" aria-label="Diagram of smoke from a stack rising on a normal day and trapped under a warm air layer during an inversion"></svg><div class="panel" aria-live="polite">Compare the two situations.</div>';
  var seen={};
  function draw(k){var s='<rect x="0" y="0" width="440" height="250" fill="#EAF3F8"/><rect x="0" y="214" width="440" height="36" fill="#6B8F5A"/><rect x="205" y="150" width="14" height="64" fill="#7A7A7A"/>';
    if(k===0){s+='<text x="12" y="30">Air cools with height: warm air near the ground can rise</text>';
      for(var i=0;i<14;i++)s+='<circle cx="'+(212+Math.sin(i)*(8+i*4))+'" cy="'+(145-i*9)+'" r="'+(4+i*0.6)+'" fill="#8A8F94" opacity="'+(0.85-i*0.04)+'"/>';
      s+='<path d="M60 215 L60 60" stroke="#C0392B" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="40" y="238" style="fill:#fff">warm</text>';}
    else{s+='<rect x="0" y="82" width="440" height="22" fill="#F1C400" opacity=".75"/><text x="12" y="98" style="font-weight:bold">layer of warm air</text><text x="12" y="30">Warm air sits above cooler air near the ground</text><text x="12" y="204" style="fill:#2F3A33">cooler air</text>';
      for(var j=0;j<18;j++)s+='<circle cx="'+(60+j*20+Math.sin(j*2)*8)+'" cy="'+(190-Math.abs(Math.cos(j))*70)+'" r="6" fill="#8A8F94" opacity=".8"/>';}
    $q(box,'svg').innerHTML=s;}
  var T=['On a normal day, warm air near the ground rises, carrying pollutants up so they disperse.','In an inversion, a layer of warm air overlies cooler air near the ground. It prevents the rising and dispersion of air pollutants, which build up near the ground.'];
  draw(0);
  Array.prototype.forEach.call(box.querySelectorAll('.sph button'),function(b){b.onclick=function(){var k=+b.dataset.k;draw(k);$q(box,'.panel').textContent=T[k];Array.prototype.forEach.call(box.querySelectorAll('.sph button'),function(x){x.classList.remove('on');});b.classList.add('on','seen');seen[k]=1;if(seen[0]&&seen[1])done();};});
}
function mountPH(box,done){
  var E=[[4.2,'All fish die (4.2). Acid rain measures about 4.2 to 4.4.'],[5.5,'Frog eggs, tadpoles, crayfish and mayflies die (5.5). Clean rain is about 5.6.'],[6.0,'Rainbow trout begin to die (6.0).'],[6.5,'A healthy lake is about 6.5. Milk is 6.5 to 6.8.'],[7,'Neutral: pure water.']];
  box.innerHTML='<label for="phs"><b>pH</b></label><br><input type="range" id="phs" min="0" max="14" step="0.1" value="7"><div class="read" id="phr"></div><div class="panel" id="php" aria-live="polite"></div>';
  var seen={};
  function upd(){var v=+$q(box,'#phs').value,f=Math.pow(10,7-v),note='';E.forEach(function(e){if(Math.abs(v-e[0])<0.15)note=e[1];});
    $q(box,'#phr').innerHTML='pH <b>'+v.toFixed(1)+'</b>: about <b>'+(f>=1?fm(f,f<10?1:0)+' times as many':fm(1/f,(1/f)<10?1:0)+' times fewer')+'</b> hydrogen ions as neutral water';
    $q(box,'#php').textContent=note||(v<7?'Acidic side of the scale.':v>7?'Basic side of the scale.':'Neutral.');seen[Math.round(v)]=1;if(Object.keys(seen).length>=6)done();}
  $q(box,'#phs').addEventListener('input',upd);upd();
}

/* ================= modules 1-3 ================= */
mod('The atmosphere','1. The atmosphere and its pollutants','About 10 minutes',
`<p>This self-guided lesson turns your <i>The Atmosphere and Air Pollution</i> slides into steps you work through yourself. Read a short section, then do the activities beneath it. Every activity gives feedback, you can retry as often as you like, and after two misses a “Show me the answer” button appears.</p>
<h3>Layers of the atmosphere</h3>
<p>Air is about 78% nitrogen and 21% oxygen, with 1% other gases. It is arranged in layers, and pressure drops quickly with height.</p>
${fig('layers','Chart of Earth’s atmosphere by altitude showing the troposphere, stratosphere, mesosphere and thermosphere, the temperature curve, the ozone layer in the stratosphere and how pressure falls with height','Earth’s atmosphere: layers, temperature and pressure.','narrow')}
${A('layersExplore',{type:'explore',q:'Select each layer to learn what happens there.',mount:mountLayers,done:'Most air pollution is a problem in the troposphere, the layer closest to us.'})}
${A('compForm',{type:'form',q:'Use the composition numbers above.',
 fields:[{label:'The “other” gases make up what percent of air?',ans:1,tolAbs:0.01,unit:'%',wrong:[{t:function(x){return x===99||x===21;},m:'Subtract both 78 and 21 from 100.'}],m:'100 − 78 − 21 = ?'},
  {label:'Nitrogen is about how many times as abundant as oxygen? (one decimal place)',ans:78/21,tol:0.03,unit:'times',m:'Divide 78 by 21.'}],
 why:'Nitrogen and oxygen together are about 99% of air. Pollutants are tiny fractions, yet they matter for health.',worked:'100 − 78 − 21 = 1, and 78 ÷ 21 ≈ 3.7.'})}
${A('ozoneMcq',{type:'mcq',q:'Ozone appears in two places in your slides. Which statement is correct?',opts:[{t:'The ozone layer is in the stratosphere. Ozone near the ground (in the troposphere) is a pollutant and the main component of photochemical smog.'},
  {t:'Ozone is helpful everywhere in the atmosphere',fb:'Tropospheric (ground-level) ozone can damage living tissue and is the primary component of photochemical smog.'},
  {t:'The ozone layer is in the troposphere, next to the ground',fb:'Look at the figure: the main concentration of the ozone layer is in the stratosphere.'},
  {t:'Ground-level ozone is released directly from tailpipes',fb:'Tropospheric ozone is a secondary pollutant. It forms from chemical reactions rather than being emitted directly.'}],ans:0,
  why:'Same molecule, very different roles: protective high up in the stratosphere, harmful at ground level.'})}
<h3>Primary and secondary pollutants</h3>
<p>An <b>atmospheric pollutant</b> is any substance, from human or natural sources, that can “injure health, harm the environment and cause property damage” (EPA). A <b>primary pollutant</b> is hazardous as emitted (for example soot or carbon monoxide). A <b>secondary pollutant</b> is produced by chemical reactions in the air (for example tropospheric ozone or sulfuric acid).</p>
${A('priSec',{type:'classify',q:'Is each pollutant primary or secondary?',cats:['Primary (directly harmful as emitted)','Secondary (made by reactions)'],
 items:[{t:'Soot',c:0,hint:'Soot is emitted directly.'},{t:'Carbon monoxide',c:0,hint:'It is a direct product of combustion.'},{t:'Tropospheric ozone',c:1,hint:'It forms when VOCs and nitrogen oxides react in sunlight.'},
  {t:'Sulfuric acid',c:1,hint:'It forms when sulfur dioxide reacts with oxygen and water.'},{t:'Nitric acid',c:1,hint:'It forms when nitrogen dioxide reacts with oxygen and water.'}],

mod('Smog and inversions','2. Smog, stacks and inversions','About 15 minutes',
`<p>Common tropospheric pollutants formed by combustion reactions include nitrogen oxides (NO<sub>x</sub>), sulfur oxides (SO<sub>x</sub>), CO<sub>2</sub>, CO, CH<sub>4</sub>, volatile organic compounds (VOCs) and particulate matter. Depending on the mix and the weather, they produce two very different kinds of smog.</p>
<div class="pair">${fig('smogla','Brown haze of photochemical smog over a city skyline','Photochemical smog: brown air.')}${fig('indsmog','Gray industrial smog over a city','Industrial smog: gray air.')}</div>
<p><b>Photochemical smog</b> (brown-air smog) forms under the influence of sunlight and is a mixture of primary and secondary pollutants. Nitrogen and oxygen form NO<sub>2</sub> (amber-orange in color), and VOCs lead to tropospheric ozone. It is common on still, sunny summer days with little wind, especially in large cities.</p>
<p><b>Industrial smog</b> (gray-air smog) is a mixture of SO<sub>x</sub>, sulfuric acid and particulate matter (aerosols, soot) from burning fossil fuels. It is a problem where pollution control is inadequate. (Aerosols are suspended solid particles and droplets.)</p>
${A('smogSort',{type:'classify',q:'Match each description to the kind of smog.',cats:['Photochemical smog','Industrial smog'],
 items:[{t:'Brown-air smog',c:0,hint:'Think of the color of the haze.'},{t:'Forms under the influence of sunlight',c:0,hint:'The name hints at light-driven reactions.'},{t:'Tropospheric ozone is its primary component',c:0,hint:'Ozone forms from VOCs and nitrogen oxides in sunlight.'},
  {t:'Gray-air smog',c:1,hint:'Think of the color of the haze.'},{t:'Mixture of SO<sub>x</sub>, sulfuric acid and particulate matter',c:1,hint:'Sulfur compounds come from burning fossil fuels.'},{t:'A problem where pollution control is inadequate',c:1,hint:'Scrubbers and other controls remove most of these pollutants.'}],
 why:'Photochemical smog is a sunlight-driven mix dominated by ozone. Industrial smog is a sulfur-and-particulate mix from burning fossil fuels.'})}
<h3>Stacks: scrubbers and the “dilution solution”</h3>
<p>Most factory and power plant smokestacks remove the majority of atmospheric pollutants with “scrubbers.” A visible plume is not necessarily a sign of the worst pollution. The “dilution solution” builds taller stacks so pollutants mix into a larger volume of air.</p>
${A('scrubMcq',{type:'mcq',q:'What do scrubbers do?',opts:[{t:'Remove most pollutants from the exhaust before it leaves the stack'},{t:'Make the stack taller so smoke spreads out',fb:'That is the “dilution solution,” a different approach.'},{t:'Turn exhaust into harmless water vapor only',fb:'Scrubbers capture pollutants. They do not simply convert everything to water vapor.'},{t:'Block sunlight so smog cannot form',fb:'Scrubbers act on the exhaust, not on sunlight.'}],ans:0,
  why:'Pay for scrubbers now, or pay for medical care later. Controls at the source are far more effective than hoping dispersion will solve the problem.'})}
${A('dilutionMcq',{type:'mcq',q:'What is the main trade-off of the “dilution solution” (taller smokestacks)?',opts:[{t:'It reduces local pollution but increases regional pollution'},{t:'It removes the pollutants permanently',fb:'Nothing is removed. The pollutants are spread over a larger volume of air.'},{t:'It increases pollution right at the stack',fb:'Local concentrations near the stack drop. It is farther away that the problem moves.'},{t:'It has no effect on where pollutants go',fb:'Taller stacks release pollutants higher, so they travel farther before settling.'}],ans:0,
  why:'Dilution moves the problem downwind. That matters again in the acid deposition module.'})}
<h3>Thermal inversions</h3>
<p>Normally air near the ground is warmer than the air above it, so it rises and carries pollutants away. In a <b>temperature (thermal) inversion</b>, a layer of warm air overlies cooler air near the ground. This weather phenomenon prevents the rising and dispersion of air pollutants.</p>
${fig('inv1','Two diagrams comparing normal air rising from a city with an inversion where a warm layer traps air near the ground','Normal conditions (top) and an inversion (bottom).','narrow')}
${A('inversionExplore',{type:'explore',q:'Compare a normal day with a thermal inversion.',mount:mountInversion,done:'Under an inversion the pollutants have nowhere to go, so concentrations climb.'})}
${A('inversionOrder',{type:'order',q:'Put the steps of how an inversion traps pollution in order.',
 items:['A layer of warm air settles over cooler air near the ground.','The cool air near the ground can no longer rise through the warm layer.','Pollutants are prevented from rising and dispersing.','Pollutant concentrations build up near the ground.'],
 nudge:'Start with how the layers of air are arranged, then follow what that does to rising air, and finally to the pollutants.',why:'The warm layer acts like a lid. Smog episodes get worse the longer an inversion lasts.'})}`);

mod('Acid deposition','4. Acid deposition','About 20 minutes',
`<h3>Review: acids, bases and pH</h3>
<p><b>Acids</b> donate protons (H<sup>+</sup>) to water to form hydronium ions (H<sub>3</sub>O<sup>+</sup>) and taste sour. <b>Bases</b> accept protons (and donate hydroxyl groups, OH<sup>−</sup>); they taste bitter and feel slippery. <b>pH</b> measures hydrogen ion concentration on a <b>logarithmic</b> scale, so each step of 1 pH unit is a tenfold change.</p>

${A('phForm',{type:'form',q:'Because pH is logarithmic, each unit is a factor of 10. Work these out (a calculator is fine, for example 10^2).',

<h3>Where acid-forming pollutants come from</h3>
<p>About half of acid-forming pollutants are sulfur compounds from industry and power plants. Of the nitrogen compounds, about 50% come from transportation sources.</p>
${A('srcMcq',{type:'mcq',q:'According to your slides, what is the main source of the sulfur pollutants that form acid?',opts:[{t:'Industry and power plants'},{t:'Transportation',fb:'Transportation is the major source of the nitrogen compounds, about half of them.'},{t:'Household products',fb:'Household products matter for indoor air, not for acid deposition.'},{t:'Volcanoes only',fb:'Natural sources exist, but the slides identify industry and power plants as the main source of sulfur pollutants.'}],ans:0,
  why:'Burning fossil fuels at industrial and power sources drives sulfur emissions, while transportation drives much of the nitrogen.'})}
<h3>How the acids form, and how they land</h3>
<p>In the atmosphere, sulfur dioxide reacts with oxygen and water to make sulfuric acid, and nitrogen dioxide makes nitric acid. <b>Wet deposition</b> is acid delivered by rain, fog, snow and so on. <b>Dry deposition</b> is dry acidic particles landing on surfaces. These terms describe the transfer process, not whether the surface itself is wet.</p>
${fig('aciddep','Diagram of acid deposition showing sunlight-driven oxidation of sulfur and nitrogen oxides into sulfuric and nitric acids that fall as acid rain, with wet and dry deposition labeled','Acid deposition: oxidation in the atmosphere, then wet or dry deposition.')}
${A('acidChem',{type:'classify',q:'Which acid does each pollutant form?',cats:['Sulfuric acid (H₂SO₄)','Nitric acid (HNO₃)'],

 why:'SO₂ leads to H₂SO₄ and NO₂ leads to HNO₃. These secondary pollutants are what make precipitation acidic.'})}

<h3>Where it lands: the pattern of acidity</h3>
${fig('phmap','Map of the United States showing the acidity of precipitation measured in 2006, with the most acidic precipitation in the eastern states downwind of the Ohio Valley','Hydrogen ion concentration (pH) of precipitation, 2006. A large concentration of power plants sits in the Ohio Valley.')}
${A('mapMcq',{type:'mcq',q:'What pattern does the pH map show, and why?',opts:[{t:'Precipitation is most acidic downwind of the large concentration of power plants in the Ohio Valley'},{t:'Precipitation is most acidic in the dry western states',fb:'The map shows the western states with the least acidic precipitation (green).'},{t:'Acidity is the same everywhere',fb:'The map shades acidity from green (less acidic) to orange (more acidic), and the shading changes across the country.'},{t:'Acidity is highest right at the equator',fb:'The map shows the United States, and the pattern follows pollution sources and prevailing winds.'}],ans:0,
  why:'Pollutants travel with the wind, so the damage appears downwind of the sources, not at the stacks. This connects back to the “dilution solution.”'})}
<h3>Why the same acid rain hurts some places more</h3>
<p><b>Buffering capacity</b> is the ability of soil or water to minimize the change in acidity when an acid or base is added.</p>
${A('bufferMcq',{type:'mcq',q:'Two lakes receive the same amount of acid rain. Lake A has good buffering capacity and Lake B has poor buffering capacity. What do you expect?',opts:[{t:'Lake A’s pH stays higher (closer to its original value) than Lake B’s'},{t:'Both lakes end up with the same pH',fb:'Buffering capacity is exactly what makes the same acid input produce different results.'},{t:'Lake B’s pH stays higher',fb:'Poor buffering means the acid changes the pH more, so Lake B’s pH falls further.'},{t:'Neither lake changes',fb:'Buffering reduces the change but does not remove it, especially under continued acid input.'}],ans:0,
  why:'Good buffering neutralizes acid compounds, so pH changes less. Poor buffering lets acidity build up.'})}
<h3>Case study: the Adirondack Mountains</h3>
${fig('acidharm','Four images of acid rain effects: an eroded stone face, dead trees, a lake being treated and a damaged maple leaf','Effects of acid deposition: eroded stone, dead trees, a lake being neutralized and a damaged maple leaf.','mid')}
<p>Acidic precipitation falls as rain and snow in the Adirondacks. The soils and bedrock cannot buffer the increased acidity, so lakes and streams are affected, with fish kills and lower biodiversity. New York State is downwind of many industrialized areas and large coal-burning power plants of the Ohio River Valley. In 1996, power plants in Ohio produced six times more sulfur dioxide and eight times more nitrogen oxides than power plants in New York State.</p>
${A('ohioForm',{type:'form',q:'Illustrative numbers (not real data): suppose New York State’s power plants emitted 100 units of sulfur dioxide and 100 units of nitrogen oxides. Using the 1996 ratios from the slides, how much did Ohio’s plants emit?',

${A('adirondack',{type:'short',q:'Explain why Adirondack lakes and streams suffer from acid deposition. Use at least three ideas from the case study.',min:25,need:3,

mod('Indoor air','6. Indoor air pollution','About 15 minutes',
`<h3>The problem</h3>
<p>Indoor air can be more polluted than outdoor air, and people spend about 90% of their time indoors, which raises the risk. Several things combine: cumulative effects from multiple sources, inadequate ventilation, and high temperature and humidity. The people who spend the most time indoors, such as the young, the elderly and the chronically ill, are often the most susceptible (EPA).</p>
${A('indoorForm',{type:'form',q:'People spend about 90% of their time indoors.',

 why:'Almost the whole day is spent breathing indoor air, so even modest indoor pollution adds up.',worked:'24 × 0.90 = 21.6 and 24 − 21.6 = 2.4.'})}
${A('indoorMcq',{type:'mcq',q:'Which best explains why indoor air can carry a greater health risk than outdoor air?',opts:[{t:'We spend about 90% of our time indoors, several sources add up, and poor ventilation lets pollutants build up'},{t:'There is never any ventilation indoors',fb:'Ventilation varies. The risk comes from inadequate ventilation, not from none at all.'},{t:'Indoor air only contains natural substances',fb:'Indoor air can hold chemicals, combustion products and biological contaminants.'},{t:'People spend most of their time outdoors',fb:'The slides say about 90% of time is spent indoors.'}],ans:0,
  why:'Time, many sources and too little ventilation together explain the risk, even if each source alone seems minor.'})}
<h3>Sources</h3>
<p>The most dangerous indoor air pollutants in developed countries (EPA) include tobacco smoke; formaldehyde, asbestos and lead; radioactive radon-222 gas and carbon monoxide; very small fine and ultrafine particles; biological contaminants (mold, pollen); and household products and pesticides. Formaldehyde comes from pressed wood products, building materials, smoking, household products and unvented fuel-burning appliances.</p>
${fig('house','Cutaway of a house showing sources of indoor air pollutants such as formaldehyde, radon, tobacco smoke, asbestos, carbon monoxide and household chemicals','Common indoor air pollutants and where they come from.','mid')}
${A('indoorSort',{type:'classify',q:'Sort these indoor pollutants by type.',cats:['Biological contaminant','Radioactive gas','Chemical or combustion product'],
 items:[{t:'Mold',c:0,hint:'It is a living organism.'},{t:'Pollen',c:0,hint:'It comes from plants.'},{t:'Radon-222',c:1,hint:'It is a radioactive gas from soil and rock.'},{t:'Formaldehyde',c:2,hint:'It is a chemical used in building materials and products.'},{t:'Carbon monoxide',c:2,hint:'It is a combustion product.'},{t:'Tobacco smoke',c:2,hint:'It is a mixture produced by burning.'}],
 why:'Different types need different controls: moisture control for mold, testing for radon, and source control and ventilation for chemicals and combustion products.'})}
<h3>Case study: radon</h3>
<div class="pair">${fig('radon','Cutaway diagram showing how radon gas enters a home from soil through cracks in the foundation','How radon-222 enters a home.')}${fig('nyradon','Map of New York State counties highlighting those with high radon levels','New York counties with high radon levels (NYS Department of Health).')}</div>
<p>Radon-222 is a radioactive gas found in some soils and rocks. It can seep into homes through openings in the foundation, and it increases the risk of lung cancer. You cannot see, smell or taste it.</p>
<div class="callout"><b>Update on the numbers.</b> Your speaker notes cite an EPA estimate of about 14,000 radon-related deaths a year (range 7,000 to 30,000). That was EPA’s earlier estimate. EPA’s updated best estimate is about 21,000 lung cancer deaths a year (range roughly 8,000 to 45,000), and radon remains the second leading cause of lung cancer after smoking.</div>
${A('radonMcq',{type:'mcq',q:'How does radon-222 usually get into a home?',opts:[{t:'It seeps up from soil and rock through openings in the foundation'},{t:'It is released by smokestacks and carried inside',fb:'Radon comes from the natural breakdown of uranium and radium in soil and rock, not from stacks.'},{t:'It is given off by cooking',fb:'Cooking is a source of other indoor pollutants, but radon comes from the ground.'},{t:'It has a strong smell that warns you',fb:'It is colorless and odorless, which is why testing matters.'}],ans:0,
  why:'Because radon cannot be sensed, testing is the only way to know. Any home, new or old, may have a radon problem.'})}
<h3>Mold</h3>
<p>Indoor mold growth is controlled by controlling moisture. Health effects include allergic reactions, asthma and other respiratory problems.</p>
${A('moldMcq',{type:'mcq',q:'What is the key to controlling indoor mold?',opts:[{t:'Controlling moisture'},{t:'Raising the temperature of the whole house',fb:'Heat is not the key. Mold grows where moisture is available.'},{t:'Using more household cleaning products',fb:'More chemicals add other indoor pollutants and do not remove the moisture that feeds mold.'},{t:'Keeping windows sealed',fb:'Sealing a home can worsen ventilation and humidity problems.'}],ans:0,
  why:'No moisture, no mold growth. Fix leaks and manage humidity.'})}
<h3>Air pollution is a big killer, and what you can do</h3>
<p>Your slides report that air pollution prematurely kills about 3 million people each year, mostly from indoor air pollution in developing countries, and that the EPA estimates annual deaths related to indoor and outdoor air pollution in the U.S. range from 150,000 to 350,000. These figures come from older sources, so check current estimates before quoting them.</p>
<p>Actions your slides suggest: test for radon and formaldehyde and fix problems; avoid furniture and products with formaldehyde; remove shoes at the door to cut dust, lead and pesticides; test pre-1980 homes for asbestos and lead; do not store gasoline or solvents inside a home or attached garage; smoke outside; make sure wood stoves, fireplaces and gas or kerosene heaters are properly installed, vented and maintained; and install carbon monoxide detectors in all sleeping areas.</p>

function allDone(){return resolvedCount(ORDER)===ORDER.length;}
function score(){var ids=scored(),t=0;ids.forEach(function(id){t+=CREDIT[S.a[id]]||0;});return 100*t/ids.length;}
function elapsed(){return Math.round(S.prior+(Date.now()-S.t0)/1000);}
function strip(h){return String(h).replace(/<[^>]*>/g,'');}

/* ---------- persistence ---------- */
function save(){
  if(PREVIEW)return;
  var c=ORDER.map(function(id){return S.a[id]||'-';}).join('');
  LMS.set('cmi.suspend_data',JSON.stringify({m:S.m,c:c,s:elapsed()}));
  LMS.set('cmi.core.lesson_location',String(S.m));
  var st=LMS.get('cmi.core.lesson_status');
  if(st===''||st==='not attempted'||st==='browsed')LMS.set('cmi.core.lesson_status','incomplete');
  LMS.set('cmi.core.exit','suspend');LMS.commit();
}
function load(){
  var js=LMS.get('cmi.suspend_data');if(!js)return;
  try{var d=JSON.parse(js);S.m=Math.min(d.m|0,MODS.length-1);S.prior=d.s|0;
    ORDER.forEach(function(id,i){var ch=(d.c||'')[i];if(ch&&ch!=='-')S.a[id]=ch;});}catch(e){}
}

/* ---------- chrome: progress wiggle + rail ---------- */
function drawWig(){
  var f=ORDER.length?resolvedCount(ORDER)/ORDER.length:0,d='';
  function y(x){return 20+8*Math.sin(x/17)+4*Math.sin(x/6.5);}
  for(var x=2;x<=258;x+=2)d+=(d?'L':'M')+x+' '+y(x).toFixed(1);
  var dx=2+256*f;
  $('wig').innerHTML='<svg viewBox="0 0 260 40"><defs><clipPath id="wc"><rect x="0" y="0" width="'+dx+'" height="40"/></clipPath></defs>'+
    '<path d="'+d+'" fill="none" stroke="#4F8A66" stroke-width="2.5"/><path d="'+d+'" fill="none" stroke="#F1C400" stroke-width="3" clip-path="url(#wc)"/>'+
    '<circle cx="'+dx+'" cy="'+y(dx)+'" r="5" fill="#FFFFFF" stroke="#04472A" stroke-width="2"/></svg>';
  $('wig').setAttribute('aria-label',Math.round(f*100)+' percent of activities finished');
}
function drawRail(){
  var h='';
  MODS.forEach(function(m,i){var n=resolvedCount(m.acts),t=m.acts.length,done=n===t;
    h+='<button type="button" data-m="'+i+'" class="'+(done?'done ':'')+(i===S.m?'cur':'')+'"><span class="pip"></span><span>'+m.short+'<small>'+n+' of '+t+' activities</small></span></button>';});
  $('rail').innerHTML=h;
}
function refresh(){drawWig();drawRail();var p=document.getElementById('modprog');if(p&&MODS[S.m]){var n=resolvedCount(MODS[S.m].acts);p.textContent=n+' of '+MODS[S.m].acts.length+' activities finished in this module';}
  var fb=document.getElementById('bFin');if(fb)fb.disabled=!allDone();}

/* ---------- activity engine ---------- */
function setFb(box,kind,html){var f=box.querySelector('.fb');f.className='fb '+kind;f.innerHTML=html;}
function mountAct(box,id){
  var d=ACTS[id],done=!!S.a[id];
  var ctx={miss:0,finish:function(kind){if(!S.a[id]){S.a[id]=kind;save();refresh();}box.classList.add('resolved');}};
  box.className='act'+(done?' resolved':'');
  var tag={mcq:'Check your thinking',classify:'Sort it out',order:'Put it in order',short:'In your own words',form:'Calculate',explore:'Explore'}[d.type];
  box.innerHTML='<div class="atag">'+tag+(done?' \u2713 finished (you can still practice)':'')+'</div><div class="abody"></div>';
  TYPES[d.type](box.querySelector('.abody'),d,ctx);
}
var TYPES={};
function lockAll(b){Array.prototype.forEach.call(b.querySelectorAll('input,select,textarea,button.up,button.dn,button.chk'),function(e){e.disabled=true;});}
function revealBtn(b,fn){var s=b.querySelector('.slot');if(s.querySelector('.rev'))return;var x=el('button','b ghost rev','Show me the answer');x.type='button';x.onclick=fn;s.appendChild(x);}

TYPES.mcq=function(b,d,ctx){
  var order=shuffle(d.opts.map(function(o,i){return i;}),d.id);
  b.innerHTML='<p class="aq">'+d.q+'</p><div class="choices">'+order.map(function(i){return '<label><input type="radio" name="r_'+d.id+'" value="'+i+'"><span>'+d.opts[i].t+'</span></label>';}).join('')+
    '</div><div class="btns"><button type="button" class="b chk">Check</button><span class="slot"></span></div><div class="fb"></div>';
  b.querySelector('.chk').onclick=function(){
    var s=b.querySelector('input:checked');if(!s){setFb(b,'hint','Choose an answer first.');return;}
    var i=+s.value;
    if(i===d.ans){setFb(b,'ok','<b>Yes.</b> '+d.why);lockAll(b);ctx.finish(ctx.miss<=1?'a':'b');}
    else{ctx.miss++;setFb(b,'no',d.opts[i].fb||'Not quite. Re-read the question and try again.');if(ctx.miss>=2)revealBtn(b,function(){
      var l=b.querySelectorAll('.choices label');Array.prototype.forEach.call(l,function(x){if(+x.querySelector('input').value===d.ans){x.classList.add('right');x.querySelector('input').checked=true;}});
      setFb(b,'hint','<b>Answer:</b> '+d.opts[d.ans].t+' '+d.why);lockAll(b);ctx.finish('r');});}
  };
};
TYPES.classify=function(b,d,ctx){
  var idx=shuffle(d.items.map(function(x,i){return i;}),d.id);
  b.innerHTML='<p class="aq">'+d.q+'</p>'+idx.map(function(i){return '<div class="crow" data-i="'+i+'"><span class="ct">'+d.items[i].t+'</span><select aria-label="Category for: '+strip(d.items[i].t).replace(/"/g,'')+'"><option value="">Choose\u2026</option>'+
    d.cats.map(function(c,k){return '<option value="'+k+'">'+c+'</option>';}).join('')+'</select><div class="cfb"></div></div>';}).join('')+
    '<div class="btns"><button type="button" class="b chk">Check</button><span class="slot"></span></div><div class="fb"></div>';
  function rows(){return Array.prototype.slice.call(b.querySelectorAll('.crow'));}
  b.querySelector('.chk').onclick=function(){
    var bad=0,blank=0;
    rows().forEach(function(r){var it=d.items[+r.dataset.i],v=r.querySelector('select').value;r.className='crow';
      if(v===''){blank++;r.querySelector('.cfb').textContent='';return;}
      if(+v===it.c){r.classList.add('ok');r.querySelector('.cfb').textContent='\u2713 '+(it.ok||'');}
      else{bad++;r.classList.add('no');r.querySelector('.cfb').textContent=it.hint||'Not that one. Think again about what this describes.';}});
    if(!bad&&!blank){setFb(b,'ok','<b>All sorted.</b> '+d.why);lockAll(b);ctx.finish(ctx.miss<=1?'a':'b');return;}
    if(blank&&!bad){setFb(b,'hint','Choose a category for every item, then check.');return;}
    ctx.miss++;setFb(b,'no',bad+' item'+(bad>1?'s are':' is')+' in the wrong place. Read the note beside '+(bad>1?'each':'it')+'.');
    if(ctx.miss>=2)revealBtn(b,function(){rows().forEach(function(r){var it=d.items[+r.dataset.i];r.querySelector('select').value=it.c;r.className='crow ok';r.querySelector('.cfb').textContent='\u2713 '+(it.ok||'');});
      setFb(b,'hint','<b>Here is the sorted list.</b> '+d.why);lockAll(b);ctx.finish('r');});
  };
};
TYPES.order=function(b,d,ctx){
  var n=d.items.length,seq=shuffle(d.items.map(function(x,i){return i;}),d.id),ok=[];
  if(seq.every(function(v,i){return v===i;}))seq.push(seq.shift());
  b.innerHTML='<p class="aq">'+d.q+'</p><div class="list"></div><div class="btns"><button type="button" class="b chk">Check order</button><span class="slot"></span></div><div class="fb"></div>';
  var list=b.querySelector('.list');
  function draw(){list.innerHTML='';seq.forEach(function(v,p){var r=el('div','orow'+(ok[p]?' ok':''));r.innerHTML='<span class="otxt">'+d.items[v]+'</span><button type="button" class="up" aria-label="Move up">\u2191</button><button type="button" class="dn" aria-label="Move down">\u2193</button>';
    r.querySelector('.up').onclick=function(){if(p>0){var t=seq[p];seq[p]=seq[p-1];seq[p-1]=t;ok=[];draw();}};
    r.querySelector('.dn').onclick=function(){if(p<n-1){var t=seq[p];seq[p]=seq[p+1];seq[p+1]=t;ok=[];draw();}};list.appendChild(r);});}
  draw();
  b.querySelector('.chk').onclick=function(){
    ok=seq.map(function(v,p){return v===p;});var c=ok.filter(Boolean).length;draw();
    if(c===n){setFb(b,'ok','<b>That is the right sequence.</b> '+d.why);lockAll(b);ctx.finish(ctx.miss<=1?'a':'b');return;}
    ctx.miss++;setFb(b,'no',c+' of '+n+' steps are in the right place (marked green). '+(d.nudge||'Re-read each step and ask what has to happen before it.'));
    if(ctx.miss>=2)revealBtn(b,function(){seq=d.items.map(function(x,i){return i;});ok=seq.map(function(){return true;});draw();setFb(b,'hint','<b>Correct order shown.</b> '+d.why);lockAll(b);ctx.finish('r');});
  };
};
TYPES.short=function(b,d,ctx){
  b.innerHTML='<p class="aq">'+d.q+'</p><textarea aria-label="Your answer" placeholder="Write in your own words\u2026"></textarea><div class="btns"><button type="button" class="b chk">Check my answer</button><span class="slot"></span></div><div class="fb"></div>';
  var ta=b.querySelector('textarea');
  b.querySelector('.chk').onclick=function(){
    var t=ta.value.trim(),w=t.split(/\s+/).filter(Boolean).length,min=d.min||10;
    if(w<min){setFb(b,'hint','Say a little more. Aim for at least '+min+' words so your thinking shows.');return;}
    var miss=[],hits=0;d.rub.forEach(function(r){var okk=r.fn?r.fn(t):r.re.test(t);if(okk)hits++;else miss.push(r.m);});
    if(hits>=(d.need||d.rub.length)){setFb(b,'ok','<b>Good.</b> '+(d.ok||'You covered the key ideas.'));lockAll(b);ctx.finish(ctx.miss<=1?'a':'b');return;}
    ctx.miss++;setFb(b,'no',(hits?'Part of this is there. ':'')+miss.slice(0,2).join(' '));
    if(ctx.miss>=2)revealBtn(b,function(){setFb(b,'hint','<b>One strong answer:</b> '+d.model);lockAll(b);ctx.finish('r');});
  };
};
TYPES.form=function(b,d,ctx){
  b.innerHTML='<p class="aq">'+d.q+'</p>'+d.fields.map(function(f,i){return '<div class="field" data-i="'+i+'"><label for="f_'+d.id+i+'">'+f.label+'</label><div class="row"><input type="text" id="f_'+d.id+i+'" autocomplete="off" spellcheck="false"> <span>'+(f.unit||'')+'</span></div><div class="ffb"></div></div>';}).join('')+
    '<div class="btns"><button type="button" class="b chk">Check</button><span class="slot"></span></div><div class="fb"></div>';
  function fields(){return Array.prototype.slice.call(b.querySelectorAll('.field'));}
  fields().forEach(function(w){w.querySelector('input').addEventListener('input',function(){w.className='field';w.querySelector('.ffb').textContent='';});});
  b.querySelector('.chk').onclick=function(){
    var bad=0,blank=0;
    fields().forEach(function(w){var f=d.fields[+w.dataset.i],raw=w.querySelector('input').value.trim(),fb=w.querySelector('.ffb');w.className='field';
      if(!raw){blank++;return;}
      var x;try{x=evalNum(raw);}catch(e){bad++;w.classList.add('no');fb.textContent='I could not read that as a number. Type digits or a calculation such as 3000*(1-e^(-0.5)), with no units.';return;}
      var okk=f.tolAbs!==undefined?Math.abs(x-f.ans)<=f.tolAbs:close(x,f.ans,f.tol);
      if(okk){w.classList.add('ok');fb.textContent='\u2713 '+(f.ok||'Correct.');return;}
      bad++;w.classList.add('no');var m=null;(f.wrong||[]).forEach(function(q){if(!m&&q.t(x))m=q.m;});fb.textContent=m||f.m||'Not quite. Check your arithmetic and try again.';});
    if(!bad&&!blank){setFb(b,'ok','<b>Right.</b> '+d.why);lockAll(b);ctx.finish(ctx.miss<=1?'a':'b');return;}
    if(blank&&!bad){setFb(b,'hint','Fill in every box, then check.');return;}
    ctx.miss++;setFb(b,'no','Look at the note under each box that needs another look.');
    if(ctx.miss>=2)revealBtn(b,function(){fields().forEach(function(w){var f=d.fields[+w.dataset.i];w.querySelector('input').value=String(+f.ans.toFixed(2));w.className='field ok';w.querySelector('.ffb').textContent='';});
      setFb(b,'hint','<b>Worked answers shown.</b> '+(d.worked||d.why));lockAll(b);ctx.finish('r');});
  };
};
TYPES.explore=function(b,d,ctx){
  b.innerHTML='<p class="aq">'+d.q+'</p><div class="ebody"></div><div class="fb"></div>';
  d.mount(b.querySelector('.ebody'),function(){setFb(b,'ok','<b>Explored.</b> '+(d.done||''));ctx.finish('e');},ACTS[d.id]);
};

/* ---------- modules ---------- */
function renderMod(i){
  S.m=i;var m=MODS[i],main=$('main');
  main.innerHTML='<article class="card"><h2>'+m.title+'</h2><p class="sec">'+m.time+'</p>'+m.body+'</article>'+
    '<div class="nav2"><div><button type="button" class="b alt" id="bPrev"'+(i===0?' disabled':'')+'>Previous module</button></div><span class="prog" id="modprog"></span><div>'+
    (i<MODS.length-1?'<button type="button" class="b" id="bNext">Next module</button>':'<button type="button" class="b" id="bFin">Finish the lesson</button>')+'</div></div>';
  Array.prototype.forEach.call(main.querySelectorAll('[data-act]'),function(x){mountAct(x,x.dataset.act);});
  save();refresh();window.scrollTo(0,0);
}
function showFinal(){
  var sc=Math.round(score()),h='<div class="card final"><h2>Lesson complete</h2><p class="sec">Mastery score on the checks</p><div class="score">'+sc+'%</div>'+
   '<p>Full credit means you got an activity right with at most one miss. Showing an answer earns half credit. Use this to decide what to revisit before the Summit.</p><table class="t"><tr><th>Module</th><th>Credit</th></tr>';
  MODS.forEach(function(m){var ids=m.acts.filter(function(id){return ACTS[id].type!=='explore';}),t=0;ids.forEach(function(id){t+=CREDIT[S.a[id]]||0;});h+='<tr><td>'+m.short+'</td><td>'+Math.round(100*t/ids.length)+'%</td></tr>';});
  h+='</table><h3>Key takeaways</h3><ul>'+TAKEAWAYS.map(function(t){return '<li>'+t+'</li>';}).join('')+'</ul><div class="btns"><button type="button" class="b alt" id="bRev">Review a module</button></div></div>';
  $('main').innerHTML=h;window.scrollTo(0,0);$('bRev').onclick=function(){renderMod(0);};
  if(PREVIEW)return;
  function hms(t){function z(x){return(x<10?'0':'')+x;}return z(Math.floor(t/3600))+':'+z(Math.floor(t%3600/60))+':'+z(t%60);}
  var stat=sc>=CONFIG.MASTERY?'passed':'completed';
  LMS.set('cmi.core.score.min','0');LMS.set('cmi.core.score.max','100');LMS.set('cmi.core.score.raw',String(sc));
  LMS.set('cmi.core.lesson_status',stat);LMS.set('cmi.core.exit','');LMS.set('cmi.core.session_time',hms(Math.max(0,Math.round((Date.now()-S.t0)/1000))));
  save();LMS.set('cmi.core.lesson_status',stat);LMS.set('cmi.core.exit','');LMS.commit();
}
document.addEventListener('click',function(e){
  var t=e.target;while(t&&t!==document&&!t.id&&!(t.dataset&&t.dataset.m!==undefined))t=t.parentNode;if(!t||t===document)return;
  if(t.dataset&&t.dataset.m!==undefined&&t.closest&&t.closest('#rail')){renderMod(+t.dataset.m);$('rail').classList.remove('open');return;}
  if(t.id==='bNext')renderMod(S.m+1);else if(t.id==='bPrev')renderMod(S.m-1);else if(t.id==='bFin')showFinal();else if(t.id==='railbtn')$('rail').classList.toggle('open');
});
window.addEventListener('pagehide',function(){if(!PREVIEW&&LMS.mode==='lms'){save();LMS.finish();}});
if(CONFIG.BLOCK_PASTE){['copy','cut','paste','drop'].forEach(function(ev){document.addEventListener(ev,function(e){e.preventDefault();},true);});}
load();drawWig();renderMod(S.m);
})();
</script></body></html>
